<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <style>
      .botao-grande {
        width: 200px;
        height: 50px;
        font-size: 18px;
        border-radius: 8px;
        background: #ffffff;
        color: rgb(0, 0, 0);
        cursor: pointer;
      }
      .display {
        background: #ffffff;
        border: 2px solid black;
        border-radius: 8px;
        width: 620px;
        height: 50px;
        text-align: right;
        box-sizing: border-box;
      }
      .grade {
        display: grid;
        grid-template-columns: repeat(4, 200px);
        grid-template-rows: repeat(4, 50px);
        gap: 10px;
      }
      .botao-zero {
        grid-row: 4;
        grid-column: 2;
      }
    </style>
  </head>
  <body>
    <div class="display">
      <p id="display"></p>
    </div>
    <br />
    <div class="grade" id="calc">
      <button class="botao-grande" onclick="addNumber(9)">9</button>
      <button class="botao-grande" onclick="addNumber(8)">8</button>
      <button class="botao-grande" onclick="addNumber(7)">7</button>
      <button class="botao-grande">+</button>

      <button class="botao-grande" onclick="addNumber(6)">6</button>
      <button class="botao-grande" onclick="addNumber(5)">5</button>
      <button class="botao-grande" onclick="addNumber(4)">4</button>
      <button class="botao-grande">-</button>

      <button class="botao-grande" onclick="addNumber(3)">3</button>
      <button class="botao-grande" onclick="addNumber(2)">2</button>
      <button class="botao-grande" onclick="addNumber(1)">1</button>
      <button class="botao-grande">/</button>

      <button class="botao-grande botao-zero" onclick="addNumber(0)">0</button>
      <button style="grid-column: 3" class="botao-grande" data-type="equal">
        =
      </button>
      <button class="botao-grande" data-type="op">X</button>
    </div>

    <script>
      function addNumber(buttonValue) {
        let calcDisplay = document.getElementById("display")
        calcDisplay.textContent += buttonValue
      }

      
    </script>
  </body>
</html>
