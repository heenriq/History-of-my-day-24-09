<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <style>
      .botao-grande {
        width: 200px;
        height: 50px;
        font-size: 18px;
        border-radius: 8px;
        background: #ffffff;
        color: rgb(0, 0, 0);
        cursor: pointer;
      }
      .botao-zero {
        grid-row: 4;
        grid-column: 2;
      }
      .display {
        background: #ffffff;
        border: 2px solid black;
        border-radius: 8px;
        width: 620px;
        height: 50px;
        text-align: right;
        box-sizing: border-box;
      }
      .grade {
        display: grid;
        grid-template-columns: repeat(4, 200px);
        grid-template-rows: repeat(4, 50px);
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="display">
      <p id="display">0</p>
    </div>
    <br />
    <div class="grade" id="divNums">
      <button class="botao-grande" data-type="num">9</button>
      <button class="botao-grande" data-type="num">8</button>
      <button class="botao-grande" data-type="num">7</button>
      <button class="botao-grande" data-type="op">+</button>

      <button class="botao-grande" data-type="num">6</button>
      <button class="botao-grande" data-type="num">5</button>
      <button class="botao-grande" data-type="num">4</button>
      <button class="botao-grande" data-type="op">-</button>

      <button class="botao-grande" data-type="num">3</button>
      <button class="botao-grande" data-type="num">2</button>
      <button class="botao-grande" data-type="num">1</button>
      <button class="botao-grande" data-type="op">/</button>

      <button class="botao-grande botao-zero" data-type="num">0</button>
      <button style="grid-column: 3" class="botao-grande" data-type="calc">
        =
      </button>
      <button class="botao-grande" data-type="op">X</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
